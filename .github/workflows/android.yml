name: Build CricXii Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  functions-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions packages
        run: npm ci

      - name: Type-check and test ID allocation
        run: npm test

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          chmod +x tool/bootstrap_android.sh
          tool/bootstrap_android.sh

      - name: Install packages
        run: flutter pub get

      - name: Generate CricXii launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=FIREBASE_ENABLED=${CRICXII_FIREBASE_ENABLED} --dart-define=APP_CHECK_ENABLED=false --dart-define=FACEBOOK_ENABLED=${CRICXII_FACEBOOK_ENABLED}

      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk CricXii-Android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricXii-Android-APK
          path: CricXii-Android-release.apk
          if-no-files-found: error
          retention-days: 30
