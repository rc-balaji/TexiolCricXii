name: crixx
description: Android-first local cricket scoring for individual singles matches.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.8.0
  cross_file: ^0.3.5+2
  crypto: ^3.0.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
